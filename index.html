  function todayKey() {
    const d = new Date();
    const tz = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
    return tz.toISOString().slice(0, 10);
  }

  function nowHM() {
    const d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function last7Days() {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const tz = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
      days.push(tz.toISOString().slice(0, 10));
    }
    return days;
  }

    return state.config[key] || DEFAULT_CONFIG[key];

  function getGistConfig() {
    return {
      id: localStorage.getItem('ct_gist_id') || '',
      token: localStorage.getItem('ct_gist_token') || ''
    };
  }

  function loadLocal() {
    const raw = localStorage.getItem('ct_local_data');
    if (!raw) return;
    try {
      const parsed = JSON.parse(raw);
      if (parsed.config) state.config = Object.assign({}, DEFAULT_CONFIG, parsed.config);
      if (parsed.records) state.records = parsed.records;
      if (parsed.catalogOverrides) state.catalogOverrides = parsed.catalogOverrides;
    } catch (e) {}
  }

  function saveLocal() {
    localStorage.setItem('ct_local_data', JSON.stringify(state));
  }

  function setGistStatus(msg, isErr) {
    const el = document.getElementById('gist-status');
    if (!el) return;
    el.textContent = msg;
    el.className = 'text-[15px] mt-1 ' + (isErr ? 'text-red-400' : 'text-emerald-400');
  }

  async function fetchFromGist() {
    const { id, token } = getGistConfig();
    if (!id || !token) return;
    try {
      const res = await fetch(`https://api.github.com/gists/${id}`, {
        headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
      });
      if (res.status === 401) { setGistStatus('401 토큰 오류 · 설정 확인', true); return; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const gist = await res.json();
      const content = gist.files?.[GIST_FILENAME]?.content;
      if (content) {
        const parsed = JSON.parse(content);
        if (parsed.config) state.config = Object.assign({}, DEFAULT_CONFIG, parsed.config);
        if (parsed.records) state.records = parsed.records;
      }
      const catalogContent = gist.files?.[CATALOG_GIST_FILENAME]?.content;
      if (catalogContent) {
        try { state.catalogOverrides = JSON.parse(catalogContent); } catch (e) {}
      }
      saveLocal();
      setGistStatus('불러오기 완료');
      renderAll();
    } catch (e) {
      setGistStatus('로드 실패: ' + e.message, true);
    }
  }

  async function saveToGist() {
    const { id, token } = getGistConfig();
    if (!id || !token) return;
    try {
      const res = await fetch(`https://api.github.com/gists/${id}`, {
        method: 'PATCH',
        headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          files: {
            [GIST_FILENAME]: { content: JSON.stringify(state, null, 2) },
            [CATALOG_GIST_FILENAME]: { content: JSON.stringify(state.catalogOverrides, null, 2) }
          }
        })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      setGistStatus('저장 완료 · ' + new Date().toLocaleTimeString('ko-KR'));
    } catch (e) {
      setGistStatus('저장 실패: ' + e.message, true);
    }
  }

  // ── 체크/기록 ────────────────────────────────
  function isValidTime(v) {
    return typeof v === 'string' && /^([01]\d|2[0-3]):([0-5]\d)$/.test(v);
  }

  function setRecord(dateStr, key, value) {
    if (!state.records[dateStr]) state.records[dateStr] = {};
    state.records[dateStr][key] = value;
    saveLocal();
  }

  function toggleCheck(key) {
    const t = todayKey();
    if (ITEM_TYPE[key] === 'time') {
      const current = state.records[t]?.[key];
      if (!isValidTime(current)) {
        setRecord(t, key, nowHM());
      } else {
        const v = prompt('기상 시간 수정 (HH:MM)', current);
        if (v === null) return;
        const m = v.trim().match(/^([01]\d|2[0-3]):([0-5]\d)$/);
        if (!m) { alert('HH:MM 형식으로 입력해주세요 (예: 07:15)'); return; }
        setRecord(t, key, v.trim());
      }
    } else {
      setRecord(t, key, !state.records[t]?.[key]);
    }
    renderAll();
    saveToGist();
  }

  function editItem(key) {
    const c = cfg(key);
    const newLabel = prompt('항목 이름', c.label);
    if (newLabel === null) return;
    const newGoal = prompt('목표 (작게 쪼갠 습관을 적어두고, 정착되면 다음 목표로 바꿔주세요)', c.goal || '');
    if (newGoal === null) return;
    state.config[key] = { label: newLabel.trim() || c.label, goal: newGoal.trim() };
    saveLocal();
    renderAll();
    saveToGist();
  }

  // ── 렌더링: 오늘 화면 ─────────────────────────
  function renderAxisCards() {
    const container = document.getElementById('axis-cards');
    container.innerHTML = AXES.map(axis => {
      const cells = axis.items.map(key => {
        const c = cfg(key);
        const t = todayKey();
        const val = state.records[t]?.[key];
        const isTime = ITEM_TYPE[key] === 'time';
        const done = isTime ? isValidTime(val) : !!val;
        const display = isTime ? (done ? val : '미기록') : (done ? '✅' : '⬜');
        const cls = done
          ? 'bg-emerald-600/20 border-emerald-500 text-emerald-400'
          : 'bg-[#0f172a] border-[#334155] text-[#f1f5f9]';
        return `
          <button data-key="${key}" onclick="toggleCheck('${key}')" class="check-cell min-h-[96px] flex flex-col items-center justify-center gap-1 rounded-lg border transition-colors duration-150 active:opacity-70 ${cls}">
            <span class="check-icon ${isTime ? 'text-[18px] font-bold' : 'text-[27px]'}">${display}</span>
            <span class="text-[15px]">${c.label}</span>
          </button>`;
      }).join('');
      const goalRows = axis.items.map(key => {
        const c = cfg(key);
        return `
          <div class="flex items-center justify-between text-[15px] text-[#f1f5f9] gap-2">
            <span class="truncate">${c.label} 목표: ${c.goal || '(미설정)'}</span>
            <button onclick="editItem('${key}')" class="flex-shrink-0 active:opacity-70">✏️</button>
          </div>`;
      }).join('');
      return `
        <div class="bg-[#1e293b] rounded-xl border border-[#334155] p-3">
          <p class="text-[21px] font-bold mb-2 text-[#c084fc]">${axis.label}</p>
          <div class="grid grid-cols-3 gap-2">${cells}</div>
          <div class="mt-2 space-y-1 border-t border-[#334155] pt-2">${goalRows}</div>
        </div>`;
    }).join('');
  }

  function renderToday() {
    document.getElementById('today-label').textContent =
      new Date().toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric', weekday: 'short' });

    renderAxisCards();

    const t = todayKey();
    let done = 0;
    ALL_ITEM_KEYS.forEach(key => {
      const val = state.records[t]?.[key];
      if (val) done++;
    });
    document.getElementById('progress-label').textContent = `${done}/${ALL_ITEM_KEYS.length} 완료`;
    document.getElementById('progress-bar').style.width = `${(done / ALL_ITEM_KEYS.length) * 100}%`;
  }

  // ── 렌더링: 최근 7일 화면 ─────────────────────
  function renderSleepChart(days) {
    const W = 320, H = 100, padL = 30, padR = 10, padT = 10, padB = 20;
    const minMin = 4 * 60, maxMin = 10 * 60;
    const pts = days.map((dateStr, i) => {
      const t = state.records[dateStr]?.sleep;
      if (!t) return null;
      const m = t.match(/^(\d{2}):(\d{2})$/);
      if (!m) return null;
      const val = Math.min(Math.max(parseInt(m[1]) * 60 + parseInt(m[2]), minMin), maxMin);
      const x = padL + (i / (days.length - 1)) * (W - padL - padR);
      const y = padT + (1 - (val - minMin) / (maxMin - minMin)) * (H - padT - padB);
      return { x, y, label: t };
    });
    let path = '', started = false;
    pts.forEach(p => {
      if (!p) { started = false; return; }
      path += (started ? 'L' : 'M') + p.x.toFixed(1) + ',' + p.y.toFixed(1) + ' ';
      started = true;
    });
    const circles = pts.map(p => p ? `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" fill="#34d399"/>` : '').join('');
    const gridLines = [4, 5, 6, 7, 8, 9, 10].map(h => {
      const val = h * 60;
      const y = padT + (1 - (val - minMin) / (maxMin - minMin)) * (H - padT - padB);
      return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="#334155" stroke-width="0.5"/><text x="0" y="${(y + 3).toFixed(1)}" font-size="12" fill="#f1f5f9">${h}시</text>`;
    }).join('');
    if (!pts.some(p => p)) {
      return `<p class="text-[15px] text-[#f1f5f9] text-center py-6">기록 없음</p>`;
    }
    return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-[100px]">${gridLines}<path d="${path.trim()}" fill="none" stroke="#34d399" stroke-width="1.5"/>${circles}</svg>`;
  }

  function renderWeekTables(days) {
    const weekdayNames = ['일', '월', '화', '수', '목', '금', '토'];
    const todayStr = todayKey();
    const container = document.getElementById('week-tables');
    container.innerHTML = AXES.map(axis => {
      let html = `<div class="bg-[#1e293b] rounded-xl border border-[#334155] p-3 overflow-x-auto">
        <p class="text-[21px] font-bold mb-2 text-[#c084fc]">${axis.label}</p>
        <table class="w-full text-[15px] text-center border-collapse">
          <thead><tr><th class="text-left text-[#f1f5f9] font-normal pb-1"></th>`;
      axis.items.forEach(key => {
        html += `<th class="text-[#f1f5f9] font-normal pb-1">${cfg(key).label.slice(0, 3)}</th>`;
      });
      html += '</tr></thead><tbody>';
      days.forEach(dateStr => {
        const d = new Date(dateStr + 'T00:00:00');
        const isToday = dateStr === todayStr;
        const label = `${d.getMonth() + 1}/${d.getDate()}(${weekdayNames[d.getDay()]})`;
        html += `<tr class="${isToday ? 'bg-[#25324a]' : ''}"><td class="text-left py-1 text-[#f1f5f9]">${label}</td>`;
        axis.items.forEach(key => {
          const val = state.records[dateStr]?.[key];
          const isTime = ITEM_TYPE[key] === 'time';
          html += `<td class="py-1">${isTime ? (isValidTime(val) ? val : '-') : (val ? '✅' : '⬜')}</td>`;
        });
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      return html;
    }).join('');
  }

  function renderWeek() {
    const days = last7Days();
    document.getElementById('sleep-chart').innerHTML = renderSleepChart(days);
    renderWeekTables(days);
  }

  function renderAll() {
    renderToday();
    renderWeek();
  }

  // ── 도메인 탭 ──────────────────────────────
  function renderDomainNav() {
    const nav = document.getElementById('domain-nav');
    nav.innerHTML = DOMAINS.map(d =>
      `<button data-domain="${d}" onclick="switchDomain('${d}')" class="px-3 py-2 text-[18px] border-b-2 border-transparent text-[#f1f5f9]">${d}</button>`
    ).join('');
  }

  function switchDomain(domain) {
    DOMAINS.forEach(d => {
      document.getElementById('domain-' + d).classList.toggle('hidden', d !== domain);
    });
    document.querySelectorAll('#domain-nav button').forEach(btn => {
      const active = btn.dataset.domain === domain;
      btn.className = 'px-3 py-2 text-[18px] border-b-2 ' + (active ? 'border-blue-400 text-blue-400' : 'border-transparent text-[#f1f5f9]');
    });
  }

  function findCatalogItem(key) {
    for (const domain of Object.keys(CATALOG)) {
      const item = CATALOG[domain].find(p => p.key === key);
      if (item) return { domain, item };
    }
    return null;
  }

  function mergedCatalogItem(item) {
    return Object.assign({}, item, state.catalogOverrides[item.key] || {});
  }

  function renderCatalog(domain) {
    const container = document.getElementById('catalog-' + domain);
    const list = CATALOG[domain] || [];
    if (!list.length) {
      container.innerHTML = `<p class="text-[18px] text-[#f1f5f9] text-center py-8">아직 등록된 프로그램이 없습니다.</p>`;
      return;
    }
    container.innerHTML = list.map(raw => {
      const p = mergedCatalogItem(raw);
      const linkHtml = p.link
        ? `<a href="${p.link}" target="_blank" rel="noopener" class="text-[15px] text-[#c084fc] underline flex-shrink-0">🔗 열기</a>`
        : '';
      return `
      <div class="bg-[#1e293b] rounded-xl border border-[#334155] p-3 mb-3">
        <div class="flex items-center justify-between mb-1 gap-2">
          <p class="text-[21px] font-bold text-[#c084fc]">${p.name}</p>
          <div class="flex items-center gap-2 flex-shrink-0">
            <span class="text-[15px] px-2 py-0.5 rounded-full border ${STATUS_STYLE[p.status] || ''}">${p.status}</span>
            <button onclick="editCatalogItem('${raw.key}')" class="active:opacity-70">✏️</button>
          </div>
        </div>
        ${linkHtml ? `<div class="mb-2">${linkHtml}</div>` : ''}
        <p class="text-[18px] text-[#f1f5f9] mb-2">${p.desc}</p>
        <div class="space-y-1 text-[15px] text-[#f1f5f9] border-t border-[#334155] pt-2">
          <p><span class="font-bold">접속:</span> ${p.access}</p>
          <p><span class="font-bold">사용법:</span> ${p.usage}</p>
          <p><span class="font-bold">주의:</span> ${p.caution}</p>
        </div>
      </div>`;
    }).join('');
  }

  function editCatalogItem(key) {
    const found = findCatalogItem(key);
    if (!found) return;
    const p = mergedCatalogItem(found.item);

    const name = prompt('이름', p.name);
    if (name === null) return;
    const desc = prompt('용도(한 줄 설명)', p.desc);
    if (desc === null) return;
    const access = prompt('접속경로', p.access);
    if (access === null) return;
    const usage = prompt('사용법', p.usage);
    if (usage === null) return;
    const caution = prompt('주의점', p.caution);
    if (caution === null) return;
    const status = prompt('상태 (운영중 / 개발중 / 중단됨 / 확인 필요)', p.status);
    if (status === null) return;
    const link = prompt('실행 링크 URL (없으면 빈 칸)', p.link || '');
    if (link === null) return;

    state.catalogOverrides[key] = {
      name: name.trim() || p.name,
      desc: desc.trim(),
      access: access.trim(),
      usage: usage.trim(),
      caution: caution.trim(),
      status: status.trim() || p.status,
      link: link.trim() || null
    };
    saveLocal();
    renderCatalog(found.domain);
    saveToGist();
  }

  // ── 탭/아코디언 ────────────────────────────
  function switchTab(tab) {
    document.getElementById('view-today').classList.toggle('hidden', tab !== 'today');
    document.getElementById('view-week').classList.toggle('hidden', tab !== 'week');
    document.getElementById('tab-today-btn').className =
      'px-3 py-2 text-[18px] border-b-2 ' + (tab === 'today' ? 'border-blue-400 text-blue-400' : 'border-transparent text-[#f1f5f9]');
    document.getElementById('tab-week-btn').className =
      'px-3 py-2 text-[18px] border-b-2 ' + (tab === 'week' ? 'border-blue-400 text-blue-400' : 'border-transparent text-[#f1f5f9]');
    if (tab === 'week') renderWeek();
  }

  function toggleSection(id, arrowId) {
    const el = document.getElementById(id);
    const arrow = document.getElementById(arrowId);
    const isHidden = el.classList.contains('hidden');
    el.classList.toggle('hidden');
    if (arrow) arrow.textContent = isHidden ? '▲' : '▼';
  }

  function saveGistConfig() {
    const id = document.getElementById('gist-id-input').value.trim();
    const token = document.getElementById('gist-token-input').value.trim();
    if (id) localStorage.setItem('ct_gist_id', id);
    if (token) localStorage.setItem('ct_gist_token', token);
    setGistStatus('설정 저장 완료');
    fetchFromGist();
  }

  // ── 초기화 ─────────────────────────────────
  loadLocal();
  const gcfg = getGistConfig();
  document.getElementById('gist-id-input').value = gcfg.id;
  renderAll();
  if (gcfg.id && gcfg.token) fetchFromGist();

  renderDomainNav();
  DOMAINS.forEach(d => { if (CATALOG[d]) renderCatalog(d); });
  switchDomain('자기관리');
</script>
</body>
</html>
